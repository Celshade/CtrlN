[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clackykey"
version = "0.1.0"
description = ""
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Celshade", email = "celshade@gmail.com"}
]
keywords = ["game", "pygame"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.0",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/Celshade/ClackyKey"
Repository = "https://github.com/Celshade/ClackyKey"
Issues = "https://github.com/Celshade/ClackyKey/issues"

[project.scripts]
clackykey = "clackykey.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clackykey"]

[tool.hatch.build.targets.wheel.force-include]
assets = "clackykey/assets"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/clackykey"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
